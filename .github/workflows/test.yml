name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...

  # Runs the real Claude Code CLI through NeoSwitch against a scripted Gemini server (see e2e/). No model or credentials are involved.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned to the version the suite and testdata/claude-code-tools.json were verified with; bump it deliberately.
      - run: npm install -g @anthropic-ai/claude-code@2.1.329
      - run: claude --version
      - run: go test -tags e2e ./...
        env:
          NEOSWITCH_E2E_REQUIRE_CLAUDE: "1"

  # Plugin users without Go download the release named by main's VERSION, and the update notice reads main's VERSION as what updating delivers, so a pull request that changes VERSION must merge exactly the tree that tag already released: tag first, wait for the release workflow, then open the pull request (see CONTRIBUTING.md). A pull request opened before the release is published passes once its checks are re-run.
  released-version:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request merge commit and its first parent, the base branch.
          fetch-depth: 2
      - name: A VERSION change merges the tree its release was built from
        env:
          REPO: ${{ github.repository }}
        run: |
          set -eu
          version="v$(tr -d ' \t\r\n' < VERSION)"
          base="v$(git show HEAD^1:VERSION | tr -d ' \t\r\n')"
          if [ "$version" = "$base" ]; then
            echo "VERSION is unchanged ($version)."
            exit 0
          fi
          if ! git fetch --depth=1 origin "refs/tags/$version:refs/tags/$version"; then
            echo "::error::VERSION changes to $version, but tag $version does not exist. Push the tag on this branch's head and wait for the release workflow before merging."
            exit 1
          fi
          if [ "$(git rev-parse "$version^{tree}")" != "$(git rev-parse HEAD^{tree})" ]; then
            echo "::error::Merging this pull request would put a tree on main that differs from the one tag $version released. Bring the branch up to date with main, move the release to a new patch version, and tag again."
            exit 1
          fi
          if ! curl -fsSIL -o /dev/null "https://github.com/$REPO/releases/download/$version/checksums.txt"; then
            echo "::error::Tag $version exists, but its release is not published yet. Wait for the release workflow, then re-run this check."
            exit 1
          fi
          echo "Release $version is published from exactly this tree."
